# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: deepseek-account
    model: deepseek-flash
    reasoningEffort: high
- id: ui-settings-account
  name: "@deepseek-ai/dsh-client-ui-settings-account"
  config:
    version: 1
    step: done
    purpose: office
    process: compact
    completion: completed
    usage: compact
    developerTools: false
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: compact
    performanceUsage: compact
- id: ui-settings
  name: "@deepseek-ai/dsh-client-ui-settings"
  config:
    enabled: false
- id: plugin-marketplace
  name: dsh-plugin-marketplace
  config:
    inventory:
      profile: desktop
      packages:
        - name: "@deepseek-ai/dsh-base"
          version: ""
          managed: false
          bundle: true
        - name: "@deepseek-ai/dsh-experimental-auto-review"
          version: ""
          managed: false
          bundle: true
        - name: "@deepseek-ai/dsh-experimental-voice-input-bundle"
          version: ""
          managed: false
          bundle: true
        - name: "@deepseek-ai/dsh-web-app"
          version: ""
          managed: false
          bundle: true
        - name: "@linxin666/dsh-client-ui-skill-explorer"
          version: 0.4.6
          managed: true
          bundle: true
        - name: "@linxin666/dsh-remote-web-ui"
          version: 0.4.6
          managed: true
          bundle: true
        - name: "@liustack/modlens"
          version: 3.26.6
          managed: true
          bundle: false
        - name: "@liustack/modsearch"
          version: 5.10.6
          managed: true
          bundle: true
        - name: "@michengai/dsh-agency-agents"
          version: 1.0.19
          managed: true
          bundle: true
        - name: "@michengai/dsh-archive-manager"
          version: 1.0.19
          managed: true
          bundle: true
        - name: "@michengai/dsh-codex-ui"
          version: 1.1.38
          managed: true
          bundle: true
        - name: "@michengai/dsh-im-connect"
          version: 0.1.76
          managed: true
          bundle: true
        - name: "@michengai/dsh-skills-manager"
          version: 1.1.21
          managed: true
          bundle: true
        - name: "@tt-a1i/archify-dsh"
          version: 1.0.0
          managed: true
          bundle: true
        - name: "@vectorize-io/hindsight-coding-agents"
          version: 0.8.1
          managed: true
          bundle: false
        - name: "@wxg-prc-cpg/browser-skill-dsh-plugin"
          version: 0.3.2
          managed: true
          bundle: true
        - name: billion-context
          version: 0.1.197
          managed: true
          bundle: true
        - name: dsh-better-sidebar
          version: 0.26.0
          managed: true
          bundle: true
        - name: dsh-context
          version: 0.71.0
          managed: true
          bundle: true
        - name: dsh-cost-meter
          version: 1.8.26
          managed: true
          bundle: true
        - name: dsh-free-search
          version: 0.8.10
          managed: true
          bundle: true
        - name: dsh-mnemon
          version: 0.5.29
          managed: true
          bundle: true
        - name: dsh-plugin-marketplace
          version: 0.5.3
          managed: true
          bundle: true
        - name: dsh-univer-office
